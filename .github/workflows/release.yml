name: Release

# Publishes a Windows installer to GitHub Releases when you push a version tag,
# e.g.  git tag v0.2.0 && git push origin v0.2.0
# The tag must match "version" in package.json (without the leading v).

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Create the (draft) release first. electron-builder uploads files in
      # parallel and, with no release to attach to, creates duplicate drafts.
      - name: Create draft release
        shell: bash
        run: gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --draft --title "Rubick ${GITHUB_REF_NAME#v}" --generate-notes

      - run: npx electron-builder --win --publish always

      # Drafts are invisible to the in-app updater, so publish once uploaded.
      - name: Publish release
        shell: bash
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
